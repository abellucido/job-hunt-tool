# Countries the search can use (the Countries dropdown on the Search page).
#
# A posting is kept when its location mentions the country's name or one of its `words`: other
# names for the country and its main cities. A fully remote posting is kept when it mentions the
# country or its region's words (e.g. "Remote, EMEA"). `code` is the ISO code SmartRecruiters uses.
#
# A country listed under `locations:` in config.yaml uses that list instead of this one, so add
# smaller towns or company sites there (e.g. Kaiseraugst for Roche). Place names that also exist
# elsewhere (Cambridge, Georgia, Victoria…) are left out on purpose: they would let in postings
# from the wrong country.

regions:
  Europe: [Europe, EMEA, EU]
  Americas: [Americas, North America, LATAM, Latin America]
  Asia-Pacific: [APAC, Asia Pacific, Asia]
  Middle East & Africa: [EMEA, MEA, Middle East, Africa]

